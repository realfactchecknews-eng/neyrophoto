<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тарифы — Нейрофото</title>
<meta name="description" content="Бесплатный конструктор, пакеты нейро-генераций и подписка Pro. Оплата через Telegram Stars и Lava Top.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pricing">
<header id="hdr"></header>

<main class="wrap">
  <section class="blk">
    <h1 style="font-size:clamp(26px,4vw,38px)">Тарифы</h1>
    <p class="muted">Конструктор аватарок и банк бесплатны всегда. Платите только за нейро-генерацию, если нужно больше трёх в день.</p>
    <div class="plans" id="plans"></div>
    <p class="note">Оплата: Telegram Stars и Lava Top. Способы оплаты подключаются, пока кнопки показывают «Скоро».</p>
  </section>
  <div data-ad="bottom"></div>
</main>

<footer id="ftr"></footer>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var C = window.NF_CONFIG, el = document.getElementById('plans');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  el.innerHTML = C.pay.plans.map(function (p) {
    var action;
    if (p.id === 'free') action = '<a class="btn ghost" href="create.html">' + esc(p.cta) + '</a>';
    else if (C.pay.lavaTopUrl || C.pay.telegramBot) {
      action = '<div class="row">' +
        (C.pay.telegramBot ? '<a class="btn" target="_blank" rel="noopener" href="https://t.me/' + esc(C.pay.telegramBot.replace('@', '')) + '?start=' + esc(p.id) + '">' + esc(p.cta) + ' · Stars</a>' : '') +
        (C.pay.lavaTopUrl ? '<a class="btn ghost" target="_blank" rel="noopener" href="' + esc(C.pay.lavaTopUrl) + '">Lava Top</a>' : '') + '</div>';
    } else action = '<button class="btn" disabled>Скоро</button>';
    return '<div class="plan' + (p.featured ? ' featured' : '') + '"><h3>' + esc(p.name) + '</h3><div class="price">' + esc(p.price) +
      '</div><div class="muted">' + esc(p.note) + '</div><ul>' + p.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' + action + '</div>';
  }).join('');
})();
</script>
</body>
</html>
